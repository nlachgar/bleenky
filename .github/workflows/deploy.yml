name: Validate and deploy Bleenky sites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview transfers without changing Hostinger
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 scripts/validate.py --marketing
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: php -l marketing/contact.php
      - run: php scripts/test_contact.php
      - name: Check JavaScript syntax
        run: find site marketing -name '*.js' -print0 | xargs -0 -r -n 1 node --check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Upload changed demo files
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_TARGET_DIR: ${{ vars.HOSTINGER_TARGET_DIR }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 scripts/deploy.py
      - name: Upload marketing site to bleenky.com
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOSTINGER_TARGET_DIR: ${{ vars.HOSTINGER_TARGET_DIR }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          DEPLOY_SITE: marketing
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 scripts/deploy.py
